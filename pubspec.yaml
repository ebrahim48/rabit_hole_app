name: rabbit_hole_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router:
  flutter_svg: ^2.0.16
  lottie:
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.3
  get: ^4.6.6
  mime_type: ^1.0.1
  flutter_spinkit: ^5.2.1
  toastification:
  quickalert: ^1.1.0
  country_pickers: ^3.0.1
  video_player: ^2.10.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  flutter_switch: ^0.3.2
  flame: ^1.17.0
  flame_svg: ^1.8.0
  internet_connection_checker_plus: ^2.5.2
  logger:
  in_app_purchase: ^3.2.3

  device_preview:
  haptic_feedback: ^0.5.1+1
  audioplayers: ^6.4.0
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons:

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_background: "#99DEFE"


flutter_gen:
  output: lib/global/custom_assets/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  # Optional
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true
    lottie: true
    #===========>>>>>>>>>> Flutter Gen Code ==============>>>>>>>>>>>
    # dart pub global activate flutter_gen
    # flutter pub run build_runner build --delete-conflicting-outputs
#    dart run build_runner build
#    fvm dart run build_runner build

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/

#example:
  fonts:
    - family: Sparklink
      fonts:
        - asset: assets/fonts/sparklink.otf

